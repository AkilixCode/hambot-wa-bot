name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 20 is the engines floor and what the Docker image runs.
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Every suite is offline: no WhatsApp session, yt-dlp or ffmpeg needed.
      - run: npm run test:all
      - run: npm audit --omit=dev --audit-level=high
