name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 22 is the engines floor; 24 is the LTS the Docker image runs.
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Every suite is offline: no WhatsApp session, yt-dlp or ffmpeg needed.
      - run: npm run test:all
      - run: npm audit --omit=dev --audit-level=high
      - run: npm install -g pm2@6
      - run: npm run test:pm2

  runtime:
    # The bot itself runs natively on Windows and macOS too: every suite but
    # the deploy.sh one (a POSIX shell wizard), on both supported Node lines.
    # The yt-dlp fake runs through the runner's own Python.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        node: ['22', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run test:runtime
      # Real pm2: `pm2 stop` must reach the bot's cleanup. On Windows pm2
      # cannot signal and sends a shutdown message instead.
      - run: npm install -g pm2@6
      - run: npm run test:pm2

  deploy-macos:
    # deploy.sh and the installer must also work with macOS's BSD tools.
    # The suite uses fakes on a sealed PATH, so no Docker or pm2 is needed.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: sh -n deploy.sh && sh -n scripts/install.sh && bash -n deploy.sh
      # The AI chat wizard tests run the bot's real connection check, which
      # needs the npm packages (not their native builds).
      - run: npm ci --ignore-scripts
      - run: npm run test:deploy
