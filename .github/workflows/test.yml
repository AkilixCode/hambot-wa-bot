name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 22 is the engines floor; 24 is the LTS the Docker image runs.
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Every suite is offline: no WhatsApp session, yt-dlp or ffmpeg needed.
      - run: npm run test:all
      - run: npm audit --omit=dev --audit-level=high
