name: Bug report
description: Something doesn't work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Running `./deploy.sh doctor` first often points at the fix.
        **Security issue?** Please don't file it here; see SECURITY.md.
  - type: dropdown
    id: mode
    attributes:
      label: How do you run HamBot?
      options:
        - Docker
        - Local (Node.js + pm2)
        - npm start by hand
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: System
      description: OS and version, e.g. Ubuntu 24.04 on a VPS, macOS 15, Raspberry Pi OS
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: The command or step, the exact input, what you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of ./deploy.sh doctor
      render: text
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: The relevant lines from `./deploy.sh logs` (set LOG_LEVEL=full in .env for more detail). Remove phone numbers and API keys.
      render: text
